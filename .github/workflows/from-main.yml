name: Release Pull Request

# A pull request into release, the branch Claude Code takes the plugin from, comes from this repo's main and nowhere
# else. The ruleset on release requires a pull request and this check, so what reaches users went through main's own
# pull request and checks first. A fork's branch named main isn't this repo's

on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  from-main:
    name: From Main
    runs-on: ubuntu-latest

    steps:
      - name: Check the Source
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" || "$HEAD_REF" != main ]]; then
            echo "::error::A pull request into release comes from main, not $HEAD_REPO:$HEAD_REF"
            exit 1
          fi
