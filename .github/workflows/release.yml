name: Release

# A pull request merged into release is a release (RELEASING.md). Two jobs: Package builds the extension from the
# merged commit with no credentials, and Publish, once a reviewer approves it in the marketplace-publish environment,
# publishes that package to the VS Code Marketplace and Open VSX, then tags the version and creates its GitHub Release.
# Publish never runs the build or the dependencies' install scripts, so nothing but vsce and ovsx sees its sign-ins.
# No token is stored: the Marketplace's Azure identity and Open VSX's trusted publisher both trust this run's OIDC token

on:
  push:
    branches: [release]

# One release at a time, and never one cancelled halfway through publishing
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version in package.json's packageManager
      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A version already tagged was released: a merge without its version bump stops here, before anything publishes
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump the version on main first (RELEASING.md)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version's section of the changelog, from its heading to the next: the GitHub Release's notes
      - name: Release Notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md \
            > dist/notes.md

          if [[ ! -s dist/notes.md ]]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

      # Builds it too (vscode:prepublish)
      - name: Package
        run: pnpm package

      - name: Keep the Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/claude-usage-bar.vsix
            dist/notes.md
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      # The tag and the GitHub Release
      contents: write
      # Signing in to Azure and to Open VSX
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # vsce and ovsx at the lockfile's versions. No install scripts run where the sign-ins are
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch the Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Sign In to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # A version either marketplace already has is skipped, so a re-run after one of them failed finishes the job
      - name: Publish to the VS Code Marketplace
        run: pnpm exec vsce publish --packagePath dist/claude-usage-bar.vsix --azure-credential --skip-duplicate

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish --packagePath dist/claude-usage-bar.vsix --trusted-publishing --skip-duplicate

      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/claude-usage-bar.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file dist/notes.md
