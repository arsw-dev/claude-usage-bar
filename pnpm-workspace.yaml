# The repo is one package, the extension: this file holds pnpm's settings and the catalogs

# Supply chain: a release must be 3 days old before it's installed, and a package's trust level (provenance, trusted
# publishing) can't drop between versions
minimumReleaseAge: 4320
trustPolicy: no-downgrade
# Dependencies of dependencies come from the registry only: no git URLs or tarballs
blockExoticSubdeps: true
# Install fails when a dependency wants to run install scripts nobody approved in allowBuilds
strictDepBuilds: true

# Every dependency's version comes from a catalog here. A version that doesn't match its catalog is an error, and entries
# nothing uses any more are removed. New ones are added with `pnpm add <name> --save-catalog-name=<area>`, saved as the
# exact version
catalogMode: strict
catalogPrune: true
savePrefix: ''

# @types/vscode isn't in a catalog: vsce reads its version from package.json to check it against engines.vscode, and
# can't read a catalog reference
catalogs:
  # Bundling the extension into the one file VS Code loads
  build:
    rolldown: 1.2.12

  # Linting and formatting
  lint:
    oxfmt: 0.71.0
    oxlint: 1.86.0
    # oxlint's type-aware rules, on TypeScript's own checker
    oxlint-tsgolint: 7.0.2003

  # Claude Code's CLI, which validates and tests the plugin
  plugin:
    '@anthropic-ai/claude-code': 2.1.291

  # Packaging the extension and publishing it to the VS Code Marketplace (vsce) and Open VSX (ovsx)
  publish:
    '@vscode/vsce': 4.0.0
    ovsx: 1.2.0

  # What the extension runs with, bundled into it
  runtime:
    zod: 4.6.5

  # The language, its Node types, and the git hooks
  tooling:
    '@types/node': 26.6.4
    lefthook: 2.1.16
    typescript: 7.0.2

allowBuilds:
  '@vscode/vsce-sign': false # vsce's signing binary, for signing packages myself; the marketplaces don't need it
  keytar: false # would build a native module to keep a publish token in the keychain, which publishing doesn't use
  '@anthropic-ai/claude-code': true # links its platform's binary (an optional dependency) in place of a placeholder
  lefthook: false # would install the git hooks itself; `pnpm install` runs `lefthook install` (prepare) instead

# Install fails on a Node version below package.json's engines
engineStrict: true
